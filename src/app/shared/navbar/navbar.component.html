<nav class="navbar">
  <div class="logo"><a routerLink="/">VELTRON</a></div>
  <ul class="nav-icons">
    <li>
    <a (click)="goToAllProducts()" class="allProducts">All Products</a>
    </li>
 <li class="search-item">

  <div class="premium-search">

    <input
      type="text"
      [(ngModel)]="searchQuery"
      placeholder="Search premium shoes..."
      (keydown.enter)="search()"
    />

    <svg
      (click)="search()"
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="white"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>

  </div>

</li>

    <li (click)="goToProfile()">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-user-round-icon lucide-circle-user-round"><path d="M18 20a6 6 0 0 0-12 0"/><circle cx="12" cy="10" r="4"/><circle cx="12" cy="12" r="10"/></svg>
    </li>

<li class="cart-item" (click)="goToCart()">

  <svg xmlns="http://www.w3.org/2000/svg"
       width="24"
       height="24"
       viewBox="0 0 24 24"
       fill="none"
       stroke="#ffffff"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
       class="lucide lucide-shopping-cart">
    <circle cx="8" cy="21" r="1"/>
    <circle cx="19" cy="21" r="1"/>
    <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
  </svg>

  
  <span class="cart-badge" *ngIf="cartCount > 0">
    {{ cartCount }}
  </span>
</li>



<li class="wishlist-item" (click)="goToWishlist()">
  <svg xmlns="http://www.w3.org/2000/svg"
       width="24"
       height="24"
       viewBox="0 0 24 24"
       fill="none"
       stroke="#ffffff"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
       class="lucide lucide-heart">
    <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
  </svg>

  <span class="wishlist-badge" *ngIf="wishlistCount > 0">
    {{ wishlistCount }}
  </span>
</li>




    <li *ngIf="isLoggedIn">
    
    </li>
  </ul>
  <button *ngIf="isLoggedIn" class="logout-btn" (click)="logout()">Logout</button>

  
</nav>
